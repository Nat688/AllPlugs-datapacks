name: Clean old GitHub Pages deployments

on:
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$repo/deployments?per_page=100" \
            --jq '.[].id' |
          while read id; do
            echo "Suppression du deployment $id"

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$repo/deployments/$id" || true
          done
